[project]
name = "phishing-detection-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "bcrypt>=5.0.0",
    "fastapi>=0.140.0",
    "joblib>=1.5.3",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "tldextract>=5.3.1",
    "ucimlrepo>=0.0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["model_dependent: assertions that depend on the trained model"]

filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
]
